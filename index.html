<style>
/* Layout: one phone-width column. A dark "dashboard" hero up top, then big rounded tiles.
   Loud colors are borrowed from the Israeli plate: plate yellow and the blue IL strip, plus a coral for "save". */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f3f5f9;
  --fg: #10141b;
  --muted: #5b6473;
  --line: #dde2ea;
  --hero: #000000;
  --hero-fg: #f4f6fa;
  --hero-muted: #9aa4b5;
  --plate: #ffcc00;
  --plate-ink: #0d0d0d;
  --il: #1f4fd1;
  --coral: #e3141b;
  --good: #128a49;
  --warn: #c97a00;
  --bad: #d22f3a;
  --shadow: 0 1px 2px rgba(16,20,27,.05), 0 8px 24px rgba(16,20,27,.06);
  --font: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-lg: 26px;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e13; --surface: #151a22; --surface-2: #1c222c; --fg: #eef1f6; --muted: #8e98a8; --line: #262d39;
    --hero: #000000; --hero-fg: #f4f6fa; --hero-muted: #9aa4b5; --il: #5a85ff; --coral: #ff3b3b;
    --good: #3fcf7d; --warn: #f2a93b; --bad: #ff6670; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e13; --surface: #151a22; --surface-2: #1c222c; --fg: #eef1f6; --muted: #8e98a8; --line: #262d39;
  --hero: #000000; --hero-fg: #f4f6fa; --hero-muted: #9aa4b5; --il: #5a85ff; --coral: #ff3b3b;
  --good: #3fcf7d; --warn: #f2a93b; --bad: #ff6670; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); /* room for the host's banner */
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: grid; gap: 14px;
  grid-template-columns: minmax(0, 1fr);
}
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--il); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand { display: block; height: 44px; width: auto; max-width: 52vw; border-radius: 12px; background: #000; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--plate); color: var(--plate-ink);
  display: grid; place-items: center; font: 800 13px/1 var(--font); box-shadow: inset 0 0 0 2px var(--plate-ink);
}
.account {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px;
}
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--il); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }

/* ---------- hero ---------- */
.hero {
  background: var(--hero); color: var(--hero-fg); border-radius: var(--r-lg); padding: 22px 18px 18px;
  display: grid; gap: 16px; position: relative; overflow: hidden;
}
.hero::after { /* subtle plate-strip motif */
  content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: var(--coral); opacity: .95;
}
.hero h1 { font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; }
.hero p { color: var(--hero-muted); font-size: 15px; }
.hero-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.shoot {
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border-radius: 18px;
  background: var(--plate); color: var(--plate-ink); font-weight: 800; font-size: 18px; border: 0;
  transition: transform .15s ease;
}
.shoot:active { transform: scale(.98); }
.gallery {
  display: grid; place-items: center; width: 60px; min-height: 60px; border-radius: 18px;
  background: rgba(255,255,255,.08); color: var(--hero-fg); border: 1px solid rgba(255,255,255,.14);
}
input[type=file] { display: none; }
.icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- model photo (above the search row) ---------- */
.model-photo {
  border-radius: var(--r-lg); overflow: hidden; background: var(--surface); box-shadow: var(--shadow);
  border: 1px solid var(--line); position: relative;
}
.model-photo img { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--surface-2); }
.model-photo figcaption {
  position: absolute; inset: auto 0 0 0; padding: 28px 16px 12px; color: #fff; font-weight: 700; font-size: 18px;
  background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0));
  display: flex; justify-content: space-between; align-items: end; gap: 10px;
}
.model-photo figcaption small { font-weight: 400; font-size: 11px; opacity: .8; }

/* ---------- plate search ---------- */
.search { display: flex; gap: 10px; align-items: stretch; }
.plate-field {
  flex: 1; min-width: 0; display: flex; direction: ltr; border-radius: 14px; overflow: hidden;
  border: 3px solid var(--plate-ink); background: var(--plate); box-shadow: var(--shadow);
}
.plate-field .il {
  flex: none; width: 34px; background: #1f4fd1; color: #fff; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; padding-bottom: 7px; font: 700 11px/1 var(--font);
}
.plate-field input {
  flex: 1; min-width: 0; height: 58px; border: 0; background: transparent; color: var(--plate-ink);
  font: 800 26px/1 var(--font); letter-spacing: .04em; text-align: center; font-variant-numeric: tabular-nums;
}
.plate-field input::placeholder { color: rgba(13,13,13,.4); font-weight: 700; font-size: 20px; letter-spacing: 0; }
.plate-field input:focus { outline: none; }
.plate-field:focus-within { outline: 3px solid var(--il); outline-offset: 2px; }
.go {
  flex: none; min-width: 76px; border: 0; border-radius: 14px; background: var(--fg); color: var(--bg); font-weight: 800; font-size: 17px;
}
.hint { color: var(--muted); font-size: 13px; }
.hint.err { color: var(--bad); }

/* ---------- history ---------- */
.history-head { display: flex; justify-content: space-between; align-items: baseline; }
.history-head h3 { font-size: 14px; font-weight: 700; color: var(--muted); }
.history-head button { border: 0; background: none; color: var(--il); font-size: 13px; font-weight: 600; padding: 4px; }
.history { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.history::-webkit-scrollbar { display: none; }
.hchip {
  flex: none; display: grid; gap: 2px; text-align: right; padding: 10px 14px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--surface); max-width: 200px;
}
.hchip b { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hchip span { font: 500 12px/1 var(--mono); color: var(--muted); direction: ltr; text-align: right; }

/* ---------- status ---------- */
.status { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.spinner { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--il); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--il); border-radius: 3px; transition: width .2s; }
.status.err { border-color: var(--bad); }
.btn-ghost { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; padding: 0 16px; }
.snap { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--r); display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 700 16px/1 var(--mono); direction: ltr; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }

/* ---------- report ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 6px; min-width: 0; box-shadow: var(--shadow); }
.card > h3 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; margin-bottom: 4px; }
.title-card { gap: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.blue { background: color-mix(in srgb, var(--il) 14%, transparent); color: var(--il); }
.title-card h2 { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
.title-card .sub { color: var(--muted); font-size: 15px; }
.title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.plate {
  direction: ltr; display: inline-flex; border-radius: 9px; overflow: hidden; border: 3px solid var(--plate-ink);
  background: var(--plate); color: var(--plate-ink);
}
.plate .il { background: #1f4fd1; color: #fff; font: 700 10px/1 var(--font); padding: 0 5px 5px; display: flex; align-items: flex-end; }
.plate .n { font: 800 24px/1 var(--font); padding: 7px 12px; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.save {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--coral); color: var(--coral); background: transparent; font-weight: 700; font-size: 14px;
}
.save.on { background: var(--coral); color: #fff; }
.save .icon { width: 18px; height: 18px; }
.save.on .icon { fill: currentColor; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 14px; gap: 2px; }
.tile .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.tile .big { font-size: 24px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.tile .big small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.tile .note { font-size: 12px; font-weight: 600; color: var(--muted); }
.ok { color: var(--good) !important; } .no { color: var(--bad) !important; }

.kv { display: grid; grid-template-columns: auto 1fr; margin: 0; }
.kv dt, .kv dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv dt { color: var(--muted); padding-left: 16px; }
.kv dd { text-align: left; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.kv > :nth-last-child(-n+2) { border-bottom: 0; }

.vin { display: inline-flex; align-items: center; gap: 8px; direction: ltr; }
.vin code { font: 700 15px/1 var(--mono); letter-spacing: .06em; }
.vin code i { font-style: normal; color: var(--muted); letter-spacing: .12em; }
.lock {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; border: 0;
  background: var(--fg); color: var(--bg); font: 700 12px/1 var(--font);
}
.lock .icon { width: 14px; height: 14px; }

.owners { list-style: none; margin: 0; padding: 0; display: grid; }
.owners li { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 15px; }
.owners li:last-child { border-bottom: 0; }
.owners .hand { font-weight: 800; }
.owners .d { color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; }

.count { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.count:last-of-type { border-bottom: 0; }
.count span { color: var(--muted); font-size: 15px; min-width: 0; }
.count b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }

.links { display: grid; gap: 8px; }
.links a {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-radius: 14px;
  background: var(--surface-2); color: var(--fg); text-decoration: none; font-weight: 600;
}
.links a::after { content: "↖"; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; }

/* stars, safety, reviews, admin */
:root { --star: #e3a400; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --star: #ffcc33; } }
:root[data-theme="dark"] { --star: #ffcc33; }
.stars { display: inline-flex; gap: 2px; direction: ltr; font-size: 20px; line-height: 1; letter-spacing: 0; }
.stars i { font-style: normal; color: var(--line); }
.stars i.on { color: var(--star); }
.stars.sm { font-size: 15px; }
.safe-big { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.safe-big b { font-size: 30px; font-weight: 800; line-height: 1; }
.safe-big .stars { font-size: 28px; }
.safe-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.safe-row:last-child { border-bottom: 0; }
.safe-row span { color: var(--muted); }
.lvl { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin: 6px 0 2px; }
.lvl i { height: 10px; border-radius: 3px; background: var(--line); }
.lvl i.on { background: var(--good); }
.subhead { font-size: 14px; font-weight: 700; margin-top: 10px; }

.rev-sum { display: flex; align-items: center; gap: 14px; }
.rev-sum b { font-size: 40px; font-weight: 800; line-height: 1; }
.rev-form { display: grid; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 14px; margin-top: 6px; }
.pick { display: flex; gap: 4px; direction: ltr; justify-content: flex-end; }
.pick button { border: 0; background: none; font-size: 30px; line-height: 1; color: var(--line); padding: 2px; }
.pick button.on { color: var(--star); }
.rev-form textarea {
  width: 100%; min-height: 90px; resize: vertical; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 10px 12px; font: 400 16px/1.5 var(--font); color: var(--fg);
}
.rev-list { display: grid; }
.rev { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rev:last-child { border-bottom: 0; }
.rev-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rev-top b { font-size: 15px; }
.rev-top small { color: var(--muted); font-size: 12px; }
.rev p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.rev .del { justify-self: start; border: 0; background: none; color: var(--bad); font-size: 13px; font-weight: 600; padding: 4px 0; }

.gbtn {
  display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; color: var(--fg);
}
.gbtn svg { width: 20px; height: 20px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.sheet { max-height: 92vh; overflow-y: auto; }
.sheet.wide { max-width: 760px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.stat span { font-size: 12px; font-weight: 700; color: var(--muted); }
.stat b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.admin-table th, .admin-table td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.admin-table th { color: var(--muted); font-weight: 700; font-size: 12px; }
.scroll-x { overflow-x: auto; }
@media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(5, 1fr); } }

/* price chart */
.chart-wrap { direction: ltr; margin-top: 8px; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap .axis { fill: var(--muted); font: 500 13px var(--font); }
.chart-wrap .area { fill: var(--coral); opacity: .12; }
.chart-wrap .line { fill: none; stroke: var(--coral); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart-wrap .dot { fill: var(--surface); stroke: var(--coral); stroke-width: 2; }
.chart-wrap .dot.me { fill: var(--coral); stroke: var(--surface); stroke-width: 2.5; }
.chart-wrap .lbl { fill: var(--fg); font: 800 14px var(--font); }
.chart-pick { direction: rtl; display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-top: 6px; }
.chart-pick b { font-variant-numeric: tabular-nums; }

/* section tabs */
.jump {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-block: 10px; background: var(--bg);
}
.jump::-webkit-scrollbar { display: none; }
.jump button {
  flex: none; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font-weight: 700; font-size: 14px;
}
.jump button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
[data-sec] { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 66px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

/* emission scale */
.eco-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.eco-top b { font-size: 34px; font-weight: 800; line-height: 1; }
.eco-top span { font-size: 14px; font-weight: 700; }
.scale { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; margin-top: 8px; direction: rtl; }
.scale i { height: 12px; border-radius: 3px; opacity: .28; }
.scale i.on { opacity: 1; outline: 2px solid var(--fg); outline-offset: 1px; }
.scale-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ---------- sheet (login / paywall) ---------- */
.sheet-back { position: fixed; inset: 0; background: rgba(5,8,12,.5); z-index: 40; display: grid; align-items: end; }
.sheet {
  background: var(--surface); border-radius: 26px 26px 0 0; max-width: 560px; width: 100%; margin: 0 auto;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet h2 { font-size: 22px; font-weight: 800; }
.sheet p { color: var(--muted); font-size: 15px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; height: 38px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input { height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; font-size: 16px; direction: ltr; text-align: right; }
.primary { height: 52px; border: 0; border-radius: 14px; background: var(--il); color: #fff; font-weight: 800; font-size: 16px; }
.primary:disabled { opacity: .6; }
.textbtn { border: 0; background: none; color: var(--muted); font-weight: 600; height: 40px; }
.msg { font-size: 14px; font-weight: 600; }

/* ---------- layout: phone first, two columns on wide screens ---------- */
.side { display: grid; gap: 14px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); }
#out { display: grid; gap: 14px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); }
#out:empty { display: none; }

@media (hover: hover) {
  .shoot:hover { filter: brightness(1.05); }
  .gallery:hover { background: rgba(255,255,255,.14); }
  .go:hover, .primary:hover:not(:disabled) { filter: brightness(1.15); }
  .hchip:hover, .jump button:not(.on):hover, .chip:hover, .btn-ghost:hover { border-color: var(--muted); }
  .links a:hover { background: var(--line); }
  .save:not(.on):hover { background: color-mix(in srgb, var(--coral) 10%, transparent); }
  .account:hover { border-color: var(--muted); }
}

@media (min-width: 640px) {
  .wrap { max-width: 640px; }
  .hero h1 { font-size: 34px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .title-card h2 { font-size: 32px; }
}

@media (min-width: 960px) {
  .wrap {
    max-width: 1180px;
    grid-template-columns: minmax(340px, 400px) minmax(0, 1fr);
    column-gap: 28px; row-gap: 18px;
    padding-block: 24px;
  }
  .topbar { grid-column: 1 / -1; }
  .side { position: sticky; top: 24px; align-self: start; }
  .history { flex-wrap: wrap; overflow: visible; }
  #out:empty { display: grid; }
  #out:empty::before {
    content: "צלמו לוחית, בחרו תמונה או הקלידו מספר רישוי, והדוח המלא יופיע כאן.";
    display: grid; place-items: center; min-height: 420px; padding: 32px; text-align: center;
    border: 2px dashed var(--line); border-radius: var(--r-lg); color: var(--muted); font-size: 17px;
  }
  .jump { top: 0; }
  [data-sec] { scroll-margin-top: 70px; }
  .snap { max-height: 300px; }
  .sheet-back { align-items: center; padding: 24px; }
  .sheet { border-radius: 26px; max-width: 440px; padding: 22px 26px 26px; }
  .grab { display: none; }
}

@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } .sheet { animation: none; } .shoot { transition: none; } }
</style>
</head>

  // ---------- data.gov.il (with fallback routes) ----------
  const ROUTES = [
    (u) => u,
    (u) => "https://corsproxy.io/?url=" + encodeURIComponent(u),
    (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    (u) => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u),
  ];
  let routeIndex = (() => { try { return Number(localStorage.getItem("carcheck.route")) || 0; } catch (_) { return 0; } })();
  if (!(routeIndex >= 0 && routeIndex < ROUTES.length)) routeIndex = 0;

  async function tryRoute(i, url) {
    let timer;
    const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("timeout")), 12000); });
    try {
      const r = await Promise.race([fetch(ROUTES[i](url)), timeout]);
      if (!r.ok) throw new Error("http " + r.status);
      const j = JSON.parse(await r.text());
      if (!j || j.success === false) throw new Error("api");
      return j;
    } finally { clearTimeout(timer); }
  }
  async function getJSON(url) {
    const order = [routeIndex, ...ROUTES.map((_, i) => i).filter((i) => i !== routeIndex)];
    let lastErr;
    for (const i of order) {
      try {
        const j = await tryRoute(i, url);
        if (i !== routeIndex) { routeIndex = i; try { localStorage.setItem("carcheck.route", String(i)); } catch (_) {} }
        return j;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error("network");
  }
  async function ds(resource, { filters, q, limit = 1 } = {}) {
    const u = new URL(API + "datastore_search");
    u.searchParams.set("resource_id", resource);
    u.searchParams.set("limit", String(limit));
    if (filters) u.searchParams.set("filters", JSON.stringify(filters));
    if (q) u.searchParams.set("q", q);

  }

  // ---------- importer list price for a new car ----------
  async function lookupNewPrice(rec) {
    if (rec.tozeret_cd == null || rec.degem_cd == null) return null;
    const base = { tozeret_cd: rec.tozeret_cd, degem_cd: rec.degem_cd };
    let exact = true;
    let r = rec.shnat_yitzur != null
      ? await ds(RES_PRICES, { filters: { ...base, shnat_yitzur: rec.shnat_yitzur }, limit: 20 }).catch(() => null)
      : null;
    if (!r || !r.records.length) { exact = false; r = await ds(RES_PRICES, { filters: base, limit: 100 }).catch(() => null); }
    const recs = (r?.records || []).filter((x) => Number(x.mehir) > 0);
    if (!recs.length) return null;
    let pool = recs;
    if (!exact) {
      const y = Number(rec.shnat_yitzur) || 0;
      const best = recs.reduce((a, b) => Math.abs(Number(b.shnat_yitzur) - y) < Math.abs(Number(a.shnat_yitzur) - y) ? b : a);
      pool = recs.filter((x) => String(x.shnat_yitzur) === String(best.shnat_yitzur));
    }
    const prices = [...new Set(pool.map((x) => Number(x.mehir)))].sort((a, b) => a - b);
    return { min: prices[0], max: prices[prices.length - 1], year: pool[0].shnat_yitzur, exact, importer: val(pool[0], "shem_yevuan") };
  }
  const ils = (n) => "₪" + Number(n).toLocaleString("he-IL");

  // rough value today: list price minus average depreciation, adjusted for owners
  const DEPRECIATION = (i) => i < 1 ? 0.12 : i < 5 ? 0.08 : 0.06;
  function estimateValue(newPrice, rec, owners) {
    const m = String(rec.moed_aliya_lakvish || "").match(/^(\d{4})-(\d{1,2})/);
    const start = m ? new Date(+m[1], +m[2] - 1, 1) : rec.shnat_yitzur ? new Date(+rec.shnat_yitzur, 6, 1) : null;
    if (!start || !newPrice) return null;
    const years = Math.max(0, (Date.now() - start.getTime()) / (365.25 * 864e5));
    let v = newPrice;
    const whole = Math.floor(years);
    for (let i = 0; i < whole; i++) v *= 1 - DEPRECIATION(i);
    v *= 1 - DEPRECIATION(whole) * (years - whole);
    const adj = [];
    const hands = owners && owners.length ? owners.length : null;
    if (hands > 1) {
      const f = Math.min(0.15, (hands - 1) * 0.03);
      v *= 1 - f; adj.push(`יד ${hands}: פחות ${Math.round(f * 100)}%`);
    }
    if (owners && owners.some((o) => /ליסינג|השכרה|חברה/.test(o.type))) { v *= 0.95; adj.push("עבר ליסינג, השכרה או חברה: פחות 5%"); }
    v = Math.max(v, newPrice * 0.08);
    const r500 = (x) => Math.round(x / 500) * 500;
    return { low: r500(v * 0.88), high: r500(v * 1.12), years, adj };
  }

  // importer of the brand, used when the exact model has no price-list entry
  async function lookupBrandImporter(rec) {

    const names = (r?.records || []).map((x) => val(x, "shem_yevuan")).filter(Boolean);
    if (!names.length) return null;
    const count = names.reduce((m, n) => m.set(n, (m.get(n) || 0) + 1), new Map());
    return [...count.entries()].sort((a, b) => b[1] - a[1])[0][0];
  }

  // list price of the same model across model years
  async function lookupPriceHistory(rec) {
    if (rec.tozeret_cd == null || rec.kinuy_mishari == null) return null;
    const r = await ds(RES_PRICES, { filters: { tozeret_cd: rec.tozeret_cd, kinuy_mishari: rec.kinuy_mishari }, limit: 1000 }).catch(() => null);
    const recs = (r?.records || []).filter((x) => Number(x.mehir) > 0 && Number(x.shnat_yitzur) > 1990);
    if (!recs.length) return null;
    const by = new Map();
    for (const x of recs) {
      const y = Number(x.shnat_yitzur);
      if (!by.has(y)) by.set(y, []);
      by.get(y).push(Number(x.mehir));
    }
    return [...by.entries()].sort((a, b) => a[0] - b[0]).map(([year, list]) => {
      const v = [...list].sort((a, b) => a - b);
      return { year, min: v[0], max: v[v.length - 1], med: v[Math.floor(v.length / 2)], n: new Set(v).size };
    });
  }

  function niceStep(range, count) {
    const raw = range / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
  }
  const kILS = (n) => n >= 1e6 ? `₪${(n / 1e6).toFixed(n % 1e6 ? 1 : 0)}M` : `₪${Math.round(n / 1000)}K`;

  function priceChartHTML(points, carYear) {
    const W = 420, H = 230, L = 50, R = 12, T = 20, B = 30;
    const xs = points.map((p) => p.year), ys = points.flatMap((p) => [p.min, p.max]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const step = niceStep(Math.max(...ys) - Math.min(...ys) || Math.max(...ys) * 0.2, 4);
    const y0 = Math.floor(Math.min(...ys) * 0.97 / step) * step;
    const y1 = Math.ceil(Math.max(...ys) * 1.03 / step) * step;
    const X = (v) => x1 === x0 ? (L + W - R) / 2 : L + (v - x0) / (x1 - x0) * (W - L - R);
    const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
    let grid = "";
    for (let v = y0; v <= y1 + 1; v += step) {
      grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${kILS(v)}</text>`;
    }
    // year labels: always first, last and the car's year; others only where they fit
    const must = new Set([x0, x1, carYear]);
    const placed = [];
    const fits = (x) => placed.every((px) => Math.abs(px - x) >= 44);
    for (const yv of [...must].filter((v) => xs.includes(v))) placed.push(X(yv));
    const yearsShown = new Set([...must].filter((v) => xs.includes(v)));
    for (const p of points) { const x = X(p.year); if (!yearsShown.has(p.year) && fits(x)) { placed.push(x); yearsShown.add(p.year); } }
    const xt = points.filter((p) => yearsShown.has(p.year))
      .map((p) => `<text class="axis" x="${X(p.year)}" y="${H - 8}" text-anchor="middle"${p.year === carYear ? ' style="fill:var(--fg);font-weight:700"' : ""}>${p.year}</text>`).join("");
    const line = points.map((p, i) => `${i ? "L" : "M"}${X(p.year).toFixed(1)},${Y(p.med).toFixed(1)}`).join("");
    const area = `${line}L${X(x1).toFixed(1)},${Y(y0)}L${X(x0).toFixed(1)},${Y(y0)}Z`;
    const dots = points.map((p) => `<circle class="dot${p.year === carYear ? " me" : ""}" data-y="${p.year}" cx="${X(p.year).toFixed(1)}" cy="${Y(p.med).toFixed(1)}" r="${p.year === carYear ? 6.5 : 4.5}"><title>${p.year}: ${ils(p.med)}</title></circle>`).join("");
    const me = points.find((p) => p.year === carYear);
    const meLbl = me ? `<text class="lbl" x="${Math.min(Math.max(X(me.year), L + 34), W - R - 34)}" y="${Y(me.med) - 12}" text-anchor="middle">${kILS(me.med)}</text>` : "";
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="מחיר מחירון לפי שנת דגם">${grid}${xt}<path class="area" d="${area}"/><path class="line" d="${line}"/>${dots}${meLbl}</svg>`;
  }

  // ---------- OCR ----------
  let worker = null;
  async function getWorker(onProgress) {
    if (worker) return worker;
    worker = await Tesseract.createWorker("eng", 1, { logger: (m) => { if (m.status === "recognizing text") onProgress(m.progress); } });
    await worker.setParameters({ tessedit_char_whitelist: "0123456789-. ", tessedit_pageseg_mode: "11" });
    return worker;
  }
  function prepImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1800 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
        for (let i = 0; i < p.length; i += 4) {
          let g = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2];
          g = Math.max(0, Math.min(255, (g - 128) * 1.6 + 128));
          p[i] = p[i + 1] = p[i + 2] = g;
        }
        ctx.putImageData(d, 0, 0);
        resolve(c);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  function extractCandidates(text) {
    const found = [];
    const add = (d) => { if ((d.length === 7 || d.length === 8) && !found.includes(d)) found.push(d); };
    for (const m of text.matchAll(/\d{2,3}[-\s.]{0,2}\d{2,3}[-\s.]{0,2}\d{2,3}/g)) add(m[0].replace(/\D/g, ""));
    for (const m of text.matchAll(/\d{7,8}/g)) add(m[0]);
    return found;
  }

  function notFound(cands) {
    out.innerHTML = `${snap()}
      <div class="card">
        <h3>${cands.length ? "המספר לא נמצא במאגר" : "לא זוהתה לוחית בתמונה"}</h3>
        <p>${cands.length ? "ייתכן שהמספר נקרא לא נכון. בחרו את המספר הנכון או תקנו אותו בשדה למעלה." : "צלמו קרוב יותר וישר מול הלוחית, או הקלידו את המספר בשדה למעלה."}</p>
        ${cands.length ? `<div class="chips" style="margin-top:8px">${cands.map((c) => `<button class="chip" data-p="${c}" type="button">${fmtPlate(c)}</button>`).join("")}</div>` : ""}
      </div>`;
    out.querySelectorAll(".chip").forEach((b) => b.onclick = () => { $("#plateInput").value = fmtPlate(b.dataset.p); $("#plateInput").focus(); });
    if (cands[0]) $("#plateInput").value = fmtPlate(cands[0]);
  }

  // ---------- report ----------
  const google = (q) => "https://www.google.com/search?q=" + encodeURIComponent(q);

  function vinHTML(vin) {
    if (!vin) return null;
    const shown = vin.slice(0, 5), hidden = Math.max(0, vin.length - 5);
    return `<span class="vin"><code>${esc(shown)}<i>${"•".repeat(hidden)}</i></code>
      <button class="lock" type="button" id="vinUnlock">${svg.lock}לשילדה המלאה</button></span>`;
  }

  function emissionHTML(level) {
    const n = Number(level);
    if (!(n >= 1 && n <= 15)) return "";
    const label = n <= 4 ? ["נמוכה מאוד", "ok"] : n <= 8 ? ["נמוכה", "ok"] : n <= 11 ? ["בינונית", ""] : ["גבוהה", "no"];
    const cells = Array.from({ length: 15 }, (_, i) => {
      const hue = 140 - (i / 14) * 140;
      return `<i style="background:hsl(${hue} 70% 45%)" class="${i + 1 === n ? "on" : ""}"></i>`;
    }).join("");
    return `<section class="card" id="secEco" data-sec>
        <h3>רמת זיהום</h3>
        <div class="eco-top"><b class="num" dir="ltr">${n}<small style="font-size:16px;color:var(--muted)">/15</small></b><span class="${label[1]}">זיהום ${label[0]}</span></div>
        <div class="scale" aria-hidden="true">${cells}</div>
        <div class="scale-legend"><span>1 · הכי נקי</span><span>15 · הכי מזהם</span></div>
        <p class="foot">קבוצת זיהום לפי משרד התחבורה ומשרד הגנת הסביבה.</p>
      </section>`;
  }

  function showReport(digits, rec) {
    const maker = cleanMaker(val(rec, "tozeret_nm"));
    const model = val(rec, "kinuy_mishari") || val(rec, "degem_nm") || "";
    const title = [maker, model].filter(Boolean).join(" ") || "רכב";
    const year = val(rec, "shnat_yitzur");
    const kind = { P: "רכב פרטי", M: "רכב מסחרי" }[String(rec.sug_degem || "").toUpperCase()] || "רכב";
    const sub = [year, val(rec, "tzeva_rechev")].filter(Boolean).join(" · ");
    const test = fmtDate(val(rec, "mivchan_acharon_dt"));
    const until = toDate(val(rec, "tokef_dt"));
    const expired = until && until < new Date();
    const plate = fmtPlate(digits);

    addToHistory(digits, title, year);
    showModelPhoto(rec, [title, year].filter(Boolean).join(" "));

    const rows = [
      ["יצרן", maker], ["דגם", val(rec, "degem_nm")], ["רמת גימור", val(rec, "ramat_gimur")],
      ["שנת ייצור", year], ["עלייה לכביש", rec.moed_aliya_lakvish ? monthYear(rec.moed_aliya_lakvish) : null],
      ["צבע", val(rec, "tzeva_rechev")], ["סוג דלק", val(rec, "sug_delek_nm")], ["דגם מנוע", val(rec, "degem_manoa")],
      ["בעלות נוכחית", val(rec, "baalut")], ["צמיגים", val(rec, "zmig_kidmi")],
    ].filter(([, v]) => v);
    const vin = vinHTML(val(rec, "misgeret"));

    out.innerHTML = `
      ${snap()}
      <section class="card title-card">
        <div class="tags"><span class="tag blue" id="kindTag">${esc(kind)}</span>${val(rec, "sug_delek_nm") ? `<span class="tag">${esc(val(rec, "sug_delek_nm"))}</span>` : ""}</div>
        <div style="display:grid;gap:4px">
          <h2>${esc(title)}</h2>
          ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
        </div>
        <div class="title-row">
          <div class="plate" aria-label="מספר רישוי ${plate}"><span class="il">IL</span><span class="n">${plate}</span></div>
          <button class="save" type="button" id="saveBtn">${svg.heart}<span>שמור</span></button>
        </div>
      </section>

      <nav class="jump" id="jump" aria-label="מעבר לחלק בדוח">
        <button type="button" data-t="secOverview" class="on">סקירה</button>
        <button type="button" data-t="ownersCard">בעלויות</button>
        <button type="button" data-t="secDetails">פרטים</button>
        <button type="button" data-t="specCard">מפרט ודלק</button>
        <button type="button" data-t="countCard">כמה בישראל</button>
        <button type="button" data-t="secSafety">בטיחות</button>
        <button type="button" data-t="secReviews">חוות דעת</button>
        <button type="button" data-t="secPrice">מחיר</button>
        ${val(rec, "kvutzat_zihum") ? `<button type="button" data-t="secEco">זיהום</button>` : ""}
      </nav>

      <div class="tiles" id="secOverview" data-sec>
        <section class="card tile">
          <span class="lbl">טסט אחרון</span>
          <span class="big" dir="ltr" style="text-align:right">${esc(test || "—")}</span>
          ${until ? `<span class="note ${expired ? "no" : "ok"}">${expired ? "רישיון פג ב-" : "בתוקף עד "}${fmtDate(val(rec, "tokef_dt"))}</span>` : ""}
        </section>
        <section class="card tile" id="handTile">
          <span class="lbl">יד</span><span class="big">…</span><span class="note">בודק בעלויות</span>
        </section>
        <section class="card tile" id="fuelTile">
          <span class="lbl">צריכת דלק</span><span class="big">…</span><span class="note">נתוני יצרן</span>
        </section>
        <section class="card tile" id="tankTile">
          <span class="lbl">מיכל דלק</span><span class="big">…</span><span class="note">נתוני יצרן</span>
        </section>
      </div>

      <section class="card" id="ownersCard" data-sec>
        <h3>היסטוריית בעלויות</h3>
        <p class="foot">בודק בעלויות…</p>
      </section>

      <section class="card" id="secDetails" data-sec>
        <h3>פרטי הרכב</h3>
        <dl class="kv">
          ${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}
          ${rec.degem_cd != null ? `<dt>קוד דגם (משרד התחבורה)</dt><dd><span dir="ltr">${esc(rec.tozeret_cd ?? "")}-${esc(rec.degem_cd)}${rec.sug_degem ? "-" + esc(rec.sug_degem) : ""}</span></dd>` : ""}
          <dt>יבואן</dt><dd id="importerRow">…</dd>
          <dt>מחירון יצרן (חדש)</dt><dd id="priceRow">…</dd>
          ${vin ? `<dt>מספר שלדה</dt><dd>${vin}</dd>` : ""}
        </dl>
      </section>

      <section class="card" id="specCard" data-sec>
        <h3>מפרט יצרן וצריכת דלק</h3>
        <p class="foot">טוען מפרט…</p>
      </section>

      <section class="card" id="countCard" data-sec>
        <h3>כמה יש בישראל</h3>
        <div class="count"><span>סופר…</span><b></b></div>
      </section>

      <section class="card" id="secSafety" data-sec>
        <h3>בטיחות ומבחני ריסוק</h3>
        ${euroNcapHTML(rec)}
        ${safetyEquipHTML(val(rec, "ramat_eivzur_betihuty"))}
        <div id="ncapBox"></div>
      </section>

      <section class="card" id="secReviews" data-sec>
        <h3>חוות דעת על ${esc(title)}</h3>
        <div id="revBox"><p class="foot">טוען חוות דעת…</p></div>
      </section>

      <section class="card" id="secPrice" data-sec>
        <h3>מחיר</h3>
        <div id="newPrice"><p class="foot">בודק מחירון יצרן…</p></div>
        <div id="estValue"></div>
        <div id="priceChart"></div>
        <p class="subhead">מחיר בשוק כרגע</p>
        <div class="links">
          <a href="${google(`site:yad2.co.il ${title} ${year || ""}`)}" target="_blank" rel="noopener">מודעות למכירה ביד2</a>
          <a href="${google(`מחירון לוי יצחק ${title} ${year || ""}`)}" target="_blank" rel="noopener">מחירון לוי יצחק</a>
        </div>
        <p class="foot">למחירון אין ממשק ציבורי חינמי, לכן המחיר נפתח בדפדפן.</p>
      </section>

      ${emissionHTML(val(rec, "kvutzat_zihum"))}

      <p class="foot">מקור: מאגרי משרד התחבורה ב-data.gov.il. הנתונים מתעדכנים מעת לעת.</p>`;

    // save button
    const saveBtn = $("#saveBtn");
    const paintSave = () => {
      const on = isSaved(digits);
      saveBtn.classList.toggle("on", on);
      saveBtn.querySelector("span").textContent = on ? "נשמר" : "שמור";
    };
    paintSave();
    saveBtn.onclick = async () => { await toggleSaved(digits, title, year); paintSave(); };

    const vinBtn = $("#vinUnlock");
    if (vinBtn) vinBtn.onclick = openPaywall;

    // ownership
    const ownersP = lookupOwners(digits);
    const priceP = lookupNewPrice(rec);
    ownersP.then((list) => {
      const tile = $("#handTile"); if (!tile) return;
      if (list && list.length) {
        tile.innerHTML = `<span class="lbl">יד</span><span class="big">${list.length}</span><span class="note">לפי רשומות הבעלות</span>`;
        const card = $("#ownersCard");
        card.innerHTML = `<h3>היסטוריית בעלויות · יד ${list.length}</h3><ol class="owners">${list.map((o, i) =>
          `<li><span class="hand">יד ${i + 1}</span><span>${esc(o.type)}</span><span class="d">${esc(o.date)}</span></li>`).join("")}</ol>`;
      } else {
        tile.innerHTML = `<span class="lbl">יד</span><span class="big">—</span><span class="note">${list ? "אין נתוני בעלות" : "המאגר לא זמין"}</span>`;
        const card = $("#ownersCard");
        if (card) card.innerHTML = `<h3>היסטוריית בעלויות</h3><p>${list ? "אין נתוני בעלות לרכב הזה במאגר." : "מאגר הבעלויות לא זמין כרגע. נסו שוב מאוחר יותר."}</p>`;
      }
    }).catch(() => {
      const tile = $("#handTile");
      if (tile) tile.innerHTML = `<span class="lbl">יד</span><span class="big">—</span><span class="note">המאגר לא זמין</span>`;
      const card = $("#ownersCard");
      if (card) card.innerHTML = `<h3>היסטוריית בעלויות</h3><p>מאגר הבעלויות לא זמין כרגע. נסו שוב מאוחר יותר.</p>`;
    });

    // manufacturer specs + fuel consumption from tests
    Promise.all([lookupSpecs(rec).catch(() => null), lookupEPA(rec).catch(() => null)]).then(([spec, epa]) => {
      const fuelTile = $("#fuelTile"), tankTile = $("#tankTile"), specCard = $("#specCard");
      if (!fuelTile) return;
      const fuel = findFuel(spec);
      const main = fuel.find((f) => f.where === "משולב") || fuel[0];
      const tank = findTank(spec);

      if (main) {
        fuelTile.innerHTML = `<span class="lbl">צריכת דלק${main.where ? " · " + main.where : ""}</span><span class="big num">${esc(main.value)}${main.unit ? ` <small>${main.unit}</small>` : ""}</span><span class="note">נתוני יצרן (WLTP)</span>`;
      } else if (epa && epa.ev && epa.kwh100) {
        fuelTile.innerHTML = `<span class="lbl">צריכת חשמל · משולב</span><span class="big num">${epa.kwh100} <small>קוט״ש ל-100 ק״מ</small></span><span class="note">לפי מבחני EPA</span>`;
      } else if (epa && epa.kml) {
        fuelTile.innerHTML = `<span class="lbl">צריכת דלק · משולב</span><span class="big num">${epa.kml} <small>ק״מ לליטר</small></span><span class="note">לפי מבחני EPA</span>`;
      } else {
        fuelTile.innerHTML = `<span class="lbl">צריכת דלק</span><span class="big">—</span><span class="note">אין נתוני צריכה לדגם</span>`;
      }

      tankTile.innerHTML = tank
        ? `<span class="lbl">מיכל דלק</span><span class="big num">${esc(tank)} <small>ליטר</small></span><span class="note">נתוני יצרן</span>`
        : (spec && val(spec, "koah_sus")
            ? `<span class="lbl">כוח מנוע</span><span class="big num">${esc(val(spec, "koah_sus"))} <small>כ״ס</small></span><span class="note">נתוני יצרן</span>`
            : `<span class="lbl">מיכל דלק</span><span class="big">—</span><span class="note">אין נתון לדגם</span>`);

      if (spec && val(spec, "merkav")) $("#kindTag").textContent = `${kind} · ${val(spec, "merkav")}`;
      const rows = spec ? SPEC_LABELS.filter(([k]) => val(spec, k)).map(([k, l, u]) => [l, val(spec, k) + (u ? " " + u : "")]) : [];
      fuel.filter((f) => f !== main).forEach((f) => rows.push([`צריכה${f.where ? " " + f.where : ""}`, f.value + (f.unit ? " " + f.unit : "")]));
      if (main) rows.unshift([`צריכת דלק${main.where ? " " + main.where : ""}`, main.value + (main.unit ? " " + main.unit : "")]);
      if (tank) rows.unshift(["נפח מיכל דלק", tank + " ליטר"]);

      let epaHTML = "";
      if (epa) {
        const r = epa.ev
          ? [["צריכה משולבת", `${epa.kwh100} קוט״ש ל-100 ק״מ`], ["טווח נסיעה", epa.range ? `${epa.range} ק״מ` : null]]
          : [["צריכה משולבת", `${epa.kml} ק״מ לליטר · ${epa.l100} ליטר ל-100 ק״מ`], ["בעיר", epa.city ? `${epa.city} ק״מ לליטר` : null], ["בכביש מהיר", epa.hwy ? `${epa.hwy} ק״מ לליטר` : null]];
        epaHTML = `<p class="subhead">צריכה במבחני EPA (ארה״ב)</p>
          <dl class="kv">${r.filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
          <p class="foot">ממוצע של ${epa.n} גרסאות ${esc(epa.model)} ${esc(epa.year)} שנבדקו. הגרסה הישראלית עשויה להיות שונה מעט.</p>`;
      }
      if (specCard) specCard.innerHTML = (rows.length || epaHTML)
        ? `<h3>מפרט יצרן וצריכת דלק</h3>${rows.length ? `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}${epaHTML}`
        : `<h3>מפרט יצרן וצריכת דלק</h3><p>לא נמצאו נתוני מפרט וצריכה לדגם הזה.</p>`;
    });

    // on phones, bring the report into view
    if (window.innerWidth < 960) {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      out.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    }

    // section tabs
    const jump = $("#jump");
    const tabs = [...jump.querySelectorAll("button")];
    const setOn = (id) => tabs.forEach((t) => {
      const on = t.dataset.t === id;
      t.classList.toggle("on", on);
      if (on) {
        const tr = t.getBoundingClientRect(), jr = jump.getBoundingClientRect();
        jump.scrollBy({ left: tr.left - (jr.left + jr.width / 2 - tr.width / 2), behavior: "smooth" });
      }
    });
    let jumping = false, jumpTimer;
    tabs.forEach((t) => t.onclick = () => {
      const el = document.getElementById(t.dataset.t);
      if (!el) return;
      jumping = true; clearTimeout(jumpTimer); jumpTimer = setTimeout(() => jumping = false, 800);
      setOn(t.dataset.t);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    });
    if (window._secObserver) window._secObserver.disconnect();
    window._secObserver = new IntersectionObserver((entries) => {
      if (jumping) return;
      const vis = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (vis) setOn(vis.target.id);
    }, { rootMargin: "-80px 0px -55% 0px" });
    out.querySelectorAll("[data-sec]").forEach((el) => window._secObserver.observe(el));

    // importer list price
    priceP.then((p) => {
      const box = $("#newPrice"), row = $("#priceRow");
      if (!box) return;
      const impRow = $("#importerRow");
      if (impRow) {
        if (p && p.importer) impRow.textContent = p.importer;
        else lookupBrandImporter(rec).then((n) => { const r2 = $("#importerRow"); if (r2) r2.textContent = n ? `${n} (יבואן המותג)` : "אין נתון"; });
      }
      if (!p) {
        box.innerHTML = `<p class="foot">אין מחירון יצרן לדגם הזה במאגר משרד התחבורה.</p>`;
        if (row) row.textContent = "אין נתון";
        return;
      }
      const price = p.min === p.max ? ils(p.min) : `${ils(p.min)}–${ils(p.max)}`;
      if (row) row.textContent = price;
      box.innerHTML = `
        <div class="safe-big"><b class="num" dir="ltr" style="font-size:32px">${price}</b></div>
        <p class="foot">מחיר מחירון של היבואן לרכב חדש, דגם שנת ${esc(p.year)}${p.exact ? "" : " (השנה הקרובה ביותר שנמצאה)"}${p.importer ? ` · יבואן: ${esc(p.importer)}` : ""}.${p.min !== p.max ? " יש כמה מחירים כי היבואן עדכן מחיר במהלך השנה." : ""}</p>`;
    }).catch(() => {
      const box = $("#newPrice"); if (box) box.innerHTML = `<p class="foot">לא הצלחתי לטעון את מחירון היצרן.</p>`;
      const row = $("#priceRow"); if (row) row.textContent = "—";
      const imp = $("#importerRow"); if (imp) imp.textContent = "—";
    });

    // estimated value today
    Promise.all([priceP.catch(() => null), ownersP.catch(() => null)]).then(([p, owners]) => {
      const box = $("#estValue"); if (!box) return;
      if (!p) { box.innerHTML = ""; return; }
      const base = (p.min + p.max) / 2;
      const e = estimateValue(base, rec, owners);
      if (!e) { box.innerHTML = ""; return; }
      box.innerHTML = `
        <div class="rev-form" style="margin-top:10px;gap:6px">
          <span class="subhead" style="margin:0">הערכת שווי היום</span>
          <b class="num" dir="ltr" style="font-size:28px;font-weight:800;text-align:right">${ils(e.low)}–${ils(e.high)}</b>
          <p class="foot">חישוב לפי מחירון חדש של ${ils(Math.round(base))}, גיל ${e.years.toFixed(1)} שנים על הכביש, וירידת ערך ממוצעת: 12% בשנה הראשונה, 8% בשנים 2 עד 5, ו-6% בכל שנה אחר כך.${e.adj.length ? " התאמות: " + e.adj.join(", ") + "." : ""}</p>
          <p class="foot"><b>זו הערכה בלבד ולא מחיר שוק.</b> המחיר בפועל תלוי בקילומטראז׳, במצב הרכב, בתאונות ובביקוש לדגם.</p>
        </div>`;
    });

    // list-price history chart
    lookupPriceHistory(rec).then((pts) => {
      const box = $("#priceChart"); if (!box) return;
      if (!pts || pts.length < 2) { box.innerHTML = ""; return; }
      const carYear = Number(val(rec, "shnat_yitzur"));
      const first = pts[0], last = pts[pts.length - 1];
      const change = Math.round((last.med / first.med - 1) * 100);
      box.innerHTML = `
        <p class="subhead">מחיר מחירון של ${esc(title)} לפי שנת דגם</p>
        <div class="chart-wrap">${priceChartHTML(pts, carYear)}</div>
        <div class="chart-pick" id="chartPick"><span>${first.year}–${last.year}</span><b>${change >= 0 ? "עלייה" : "ירידה"} של ${Math.abs(change)}% במחירון</b></div>
        <p class="foot">מחיר רכב חדש מכל שנת דגם, לפי מחירוני היבואנים במשרד התחבורה. הנקודה המלאה היא שנת הרכב שלך. לחצו על נקודה כדי לראות את המחיר.</p>`;
      box.querySelectorAll(".dot").forEach((d) => d.addEventListener("click", () => {
        const p = pts.find((x) => String(x.year) === d.dataset.y);
        if (!p) return;
        $("#chartPick").innerHTML = `<span>דגם ${p.year}</span><b>${p.min === p.max ? ils(p.min) : `${ils(p.min)}–${ils(p.max)}`}</b>`;
      }));
    }).catch(() => { const b = $("#priceChart"); if (b) b.innerHTML = ""; });

    // safety stars + reviews
    loadSafety(rec);
    currentModel = { key: `${rec.tozeret_cd ?? maker}|${val(rec, "kinuy_mishari") || val(rec, "degem_nm") || ""}`, title, year };
    loadReviews();

    // fleet counts
    countSame(rec).then((c) => {
      const card = $("#countCard"); if (!card) return;
      card.innerHTML = `<h3>כמה יש בישראל</h3>
        <div class="count"><span>אותו דגם ושנה (${esc(year || "—")})</span><b>${nf(c.exact)}</b></div>
        <div class="count"><span>${esc(title)}, כל השנים</span><b>${nf(c.family)}</b></div>
        <p class="foot">רכבים פעילים הרשומים במשרד התחבורה</p>`;
    });
  }

  // ---------- fuel economy tests (US EPA, fueleconomy.gov) ----------
  const EPA = "https://www.fueleconomy.gov/ws/rest";
  async function anyText(url) {
    for (const route of ROUTES) {
      let timer;
      try {
        const to = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("timeout")), 10000); });
        const res = await Promise.race([fetch(route(url), { headers: { Accept: "application/json" } }), to]);
        if (!res.ok) continue;
        const t = (await res.text()).trim();
        if (t) return t;
      } catch (_) {} finally { clearTimeout(timer); }
    }
    return null;
  }
  function parseEPA(t) {
    if (!t) return null;
    if (t[0] === "{" || t[0] === "[") { try { return JSON.parse(t); } catch (_) { return null; } }
    try {
      const doc = new DOMParser().parseFromString(t, "application/xml");
      if (doc.querySelector("parsererror")) return null;
      const root = doc.documentElement;
      const items = [...root.getElementsByTagName("menuItem")];
      if (items.length) return { menuItem: items.map((i) => ({ text: i.getElementsByTagName("text")[0]?.textContent, value: i.getElementsByTagName("value")[0]?.textContent })) };
      const o = {};
      for (const c of root.children) o[c.tagName] = c.textContent;
      return o;
    } catch (_) { return null; }
  }
  const menuOf = (d) => { const m = d?.menuItem; return !m ? [] : Array.isArray(m) ? m : [m]; };
  const median = (a) => { const b = [...a].sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; };

  async function lookupEPA(rec) {
    const make = makerEn(val(rec, "tozeret_nm") || "");
    const year = val(rec, "shnat_yitzur");
    const kin = val(rec, "kinuy_mishari") || "";
    if (!make || !year || Number(year) < 1984 || !/[A-Za-z0-9]/.test(kin)) return null;
    const epaMake = { Mini: "MINI" }[make] || make;
    const models = menuOf(parseEPA(await anyText(`${EPA}/vehicle/menu/model?year=${year}&make=${encodeURIComponent(epaMake)}`)))
      .map((m) => m.value || m.text).filter(Boolean);
    if (!models.length) return null;

    const key = norm(kin.replace(new RegExp(make, "i"), "")) || norm(kin);
    const fuelHeb = val(rec, "sug_delek_nm") || "";
    const plug = /PLUG|PHEV/i.test(kin) || /פלאג/.test(fuelHeb);
    const hybrid = !plug && (/היברי|HYBRID/i.test(fuelHeb + " " + kin));
    const ev = !hybrid && !plug && /חשמל/.test(fuelHeb);
    // a model matches when its first words spell the Israeli model name ("3 4-Door" → "3", "CX-5 2WD" → "CX-5")
    const matches = models.filter((m) => {
      const words = m.replace(new RegExp("^" + make + "\\s+", "i"), "").split(/\s+/);
      for (let k = 1; k <= Math.min(3, words.length); k++) {
        if (norm(words.slice(0, k).join("")) === key) {
          const rest = words.slice(k).join(" ");
          return !/cross/i.test(rest) || /CROSS/.test(key);
        }
      }
      return false;
    });
    if (!matches.length) return null;
    const isHy = (m) => /hybrid/i.test(m) && !/plug/i.test(m);
    const isPl = (m) => /plug-?in|phev/i.test(m);
    const isEv = (m) => /\b(electric|ev)\b/i.test(m);
    let pool = plug ? matches.filter(isPl) : hybrid ? matches.filter(isHy) : ev ? matches.filter(isEv) : matches.filter((m) => !isHy(m) && !isPl(m) && !isEv(m));
    if (!pool.length) pool = matches;
    const model = pool.sort((a, b) => a.length - b.length)[0];

    const opts = menuOf(parseEPA(await anyText(`${EPA}/vehicle/menu/options?year=${year}&make=${encodeURIComponent(epaMake)}&model=${encodeURIComponent(model)}`)))
      .map((o) => o.value).filter(Boolean).slice(0, 3);
    const cars = (await Promise.all(opts.map(async (id) => parseEPA(await anyText(`${EPA}/vehicle/${id}`))))).filter(Boolean);
    if (!cars.length) return null;
    const num = (v) => { const x = parseFloat(v); return Number.isFinite(x) && x > 0 ? x : null; };
    const evCar = cars.every((c) => /electric/i.test(c.fuelType1 || c.fuelType || ""));
    if (evCar) {
      const kwh = median(cars.map((c) => num(c.combE)).filter(Boolean));
      const range = median(cars.map((c) => num(c.range)).filter(Boolean));
      if (!kwh) return null;
      return { ev: true, kwh100: (kwh / 1.609).toFixed(1), range: range ? Math.round(range * 1.609) : null, model, year, n: cars.length };
    }
    const comb = median(cars.map((c) => num(c.comb08)).filter(Boolean));
    if (!comb) return null;
    const city = median(cars.map((c) => num(c.city08)).filter(Boolean));
    const hwy = median(cars.map((c) => num(c.highway08)).filter(Boolean));
    const kml = (m) => m ? (m * 0.425144).toFixed(1) : null;
    return { ev: false, kml: kml(comb), l100: (235.215 / comb).toFixed(1), city: kml(city), hwy: kml(hwy), model, year, n: cars.length };
  }

  // ---------- safety ----------
  const starsHTML = (n, max = 5, cls = "") => {
    const k = Math.max(0, Math.min(max, Math.round(Number(n) || 0)));
    return `<span class="stars ${cls}" aria-label="${k} מתוך ${max} כוכבים">${Array.from({ length: max }, (_, i) => `<i class="${i < k ? "on" : ""}">★</i>`).join("")}</span>`;
  };

  // Euro NCAP results (standard equipment) for models common in Israel: [test year, stars]
  const EURO_NCAP = {
    Toyota: { COROLLA: [[2019,5]], YARIS: [[2020,5]], YARISCROSS: [[2021,5]], CHR: [[2017,5],[2024,5]], RAV4: [[2019,5]], CAMRY: [[2019,5]], PRIUS: [[2016,5]], BZ4X: [[2022,5]] },
    Hyundai: { I10: [[2020,3]], I20: [[2021,4]], I30: [[2017,5]], BAYON: [[2021,4]], KONA: [[2017,5],[2023,4]], TUCSON: [[2021,5]], SANTAFE: [[2024,5]], IONIQ5: [[2021,5]], IONIQ6: [[2022,5]] },
    Kia: { PICANTO: [[2017,3]], CEED: [[2019,5]], XCEED: [[2019,5]], NIRO: [[2016,4],[2022,4]], SPORTAGE: [[2022,5]], SORENTO: [[2020,5]], EV6: [[2022,5]], EV9: [[2023,5]] },
    Mazda: { "2": [[2015,4]], "3": [[2019,5]], CX3: [[2015,4]], CX30: [[2019,5]], CX5: [[2017,5]], CX60: [[2022,5]] },
    Skoda: { FABIA: [[2021,5]], SCALA: [[2019,5]], OCTAVIA: [[2019,5]], KAMIQ: [[2019,5]], KAROQ: [[2017,5]], KODIAQ: [[2017,5],[2024,5]], SUPERB: [[2015,5],[2024,5]], ENYAQ: [[2021,5]] },
    Volkswagen: { POLO: [[2017,5]], GOLF: [[2019,5]], TROC: [[2017,5]], TCROSS: [[2019,5]], TIGUAN: [[2016,5],[2024,5]], PASSAT: [[2014,5]], ID3: [[2020,5]], ID4: [[2021,5]] },
    SEAT: { IBIZA: [[2017,5]], ARONA: [[2017,5]], LEON: [[2020,5]], ATECA: [[2016,5]] },
    Cupra: { FORMENTOR: [[2021,5]], BORN: [[2021,5]] },
    Suzuki: { SWIFT: [[2017,3],[2024,3]], IGNIS: [[2016,3]], VITARA: [[2015,5]], JIMNY: [[2018,3]] },
    Mitsubishi: { OUTLANDER: [[2012,5]], ECLIPSECROSS: [[2017,5]] },
    Nissan: { MICRA: [[2017,4]], JUKE: [[2019,5]], QASHQAI: [[2021,5]], XTRAIL: [[2022,5]], LEAF: [[2018,5]] },
    Renault: { CLIO: [[2019,5]], CAPTUR: [[2019,5]], ARKANA: [[2021,5]], AUSTRAL: [[2022,5]] },

    Citroen: { C3: [[2017,4]], C3AIRCROSS: [[2017,4]], C4: [[2021,4]], C5AIRCROSS: [[2019,4]] },
