    Honda: { JAZZ: [[2020,5]], CIVIC: [[2022,5]], HRV: [[2021,4]], ZRV: [[2023,4]], CRV: [[2024,4]] },
    BYD: { ATTO3: [[2022,5]], DOLPHIN: [[2023,5]], SEAL: [[2023,5]], SEALU: [[2023,5]] },
    MG: { ZSEV: [[2019,5]], HS: [[2019,5]], MG4: [[2022,5]], "4": [[2022,5]] },
    Tesla: { MODEL3: [[2019,5]], MODELY: [[2022,5]] },
    Ford: { FIESTA: [[2017,5]], FOCUS: [[2018,5]], PUMA: [[2019,5]], KUGA: [[2019,5]] },
    Jeep: { RENEGADE: [[2014,5]], COMPASS: [[2017,5]], AVENGER: [[2023,3]] },
    Subaru: { XV: [[2017,5]], FORESTER: [[2019,5]], OUTBACK: [[2021,5]] },
    Lexus: { UX: [[2019,5]], NX: [[2022,5]] },
    Volvo: { XC40: [[2018,5]], XC60: [[2017,5]], XC90: [[2015,5]], EX30: [[2024,5]] },
    Chery: { TIGGO7: [[2025,5]], TIGGO8: [[2025,5]] },
    Omoda: { "5": [[2022,5]], OMODA5: [[2022,5]] },
  };
  const NCAP_SUFFIX = ["", "HYBRID", "HEV", "PHEV", "EV", "ELECTRIC", "PLUGIN", "SW", "SPORTBACK", "HATCHBACK", "HB", "SEDAN", "ESTATE", "COMBI", "WAGON", "RS", "FR", "GT", "GTI", "N", "NLINE", "TOURING", "SPORT"];

  function findEuroNcap(rec) {
    const make = makerEn(val(rec, "tozeret_nm") || "");
    const table = EURO_NCAP[make];
    const kin = val(rec, "kinuy_mishari") || "";
    if (!table || !kin) return null;
    const full = norm(kin), noMake = norm(kin.replace(new RegExp(make, "i"), ""));
    let hit = null;
    for (const name of [noMake, full]) {
      for (const key of Object.keys(table).sort((a, b) => b.length - a.length)) {
        if (name.startsWith(key) && NCAP_SUFFIX.includes(name.slice(key.length))) { hit = key; break; }
      }
      if (hit) break;
    }
    if (!hit) return null;
    const tests = table[hit];
    const year = Number(val(rec, "shnat_yitzur")) || 9999;
    // the newest test that already applied to this model year (a new generation usually appears a year before its test)
    const t = [...tests].reverse().find(([ty]) => ty <= year + 1) || tests[0];
    return { year: t[0], stars: t[1], older: year < t[0] - 1 };
  }

  function euroNcapHTML(rec) {
    const r = findEuroNcap(rec);
    const carYear = val(rec, "shnat_yitzur");
    if (!r) return `<p class="subhead" style="margin-top:0">Euro NCAP</p><p class="foot">אין במאגר שלנו תוצאת Euro NCAP לדגם הזה.</p>`;
    return `
      <p class="subhead" style="margin-top:0">כוכבי בטיחות Euro NCAP</p>
      <div class="safe-big"><b class="num" dir="ltr">${r.stars}<small style="font-size:16px;color:var(--muted)">/5</small></b>${starsHTML(r.stars)}</div>
      <p class="foot">מבחן Euro NCAP משנת ${r.year}, בגרסה עם אבזור בטיחות סטנדרטי.${r.older ? ` הרכב שלך משנת ${esc(carYear)}, וייתכן שהוא מדור קודם שקיבל ציון אחר.` : ""}</p>
      <div style="height:6px"></div>`;
  }

  function safetyEquipHTML(v) {
    const n = Number(v);
    if (v == null || Number.isNaN(n)) return "";
    const cells = n <= 8 ? `<div class="lvl" aria-hidden="true">${Array.from({ length: 8 }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>` : "";
    return `<div class="safe-row" style="border:0;padding-bottom:0"><span>רמת אבזור בטיחותי (משרד התחבורה)</span><b class="num" dir="ltr">${n}${n <= 8 ? " / 8" : ""}</b></div>
      ${cells}<p class="foot">מערכות בטיחות מתקדמות ברכב, כמו בלימה אוטומטית ושמירת נתיב. 8 זו הרמה הגבוהה ביותר.</p>`;
  }

  async function anyJSON(url) {
    for (const route of ROUTES) {
      let timer;
      try {
        const to = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("timeout")), 10000); });
        const res = await Promise.race([fetch(route(url)), to]);
        if (!res.ok) continue;
        return JSON.parse(await res.text());
      } catch (_) {} finally { clearTimeout(timer); }
    }
    return null;
  }
  const norm = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

  // US government crash tests (NHTSA). Only models also sold in the US are covered.
  async function lookupNHTSA(rec) {
    const make = makerEn(val(rec, "tozeret_nm") || "");
    const year = val(rec, "shnat_yitzur");
    const kin = val(rec, "kinuy_mishari") || "";
    if (!make || !year || !/[A-Za-z0-9]/.test(kin)) return null;
    const base = "https://api.nhtsa.gov/SafetyRatings";
    const models = await anyJSON(`${base}/modelyear/${year}/make/${encodeURIComponent(make)}`);
    const list = (models?.Results || []).map((m) => m.Model).filter(Boolean);
    if (!list.length) return null;
    const k1 = norm(kin), k2 = norm(kin.replace(new RegExp(make, "i"), "")), mk = norm(make);
    const keys = [k1, k2, mk + k2].filter((k) => k.length >= 2);
    const model = list.find((m) => keys.includes(norm(m))) || list.find((m) => keys.some((k) => k.length >= 3 && norm(m).startsWith(k)));
    if (!model) return null;
    const vars = await anyJSON(`${base}/modelyear/${year}/make/${encodeURIComponent(make)}/model/${encodeURIComponent(model)}`);
    const vid = vars?.Results?.[0]?.VehicleId;
    if (!vid) return null;
    const r = await anyJSON(`${base}/VehicleId/${vid}`);
    const x = r?.Results?.[0];
    if (!x) return null;
    return { desc: x.VehicleDescription, overall: x.OverallRating, front: x.OverallFrontCrashRating, side: x.OverallSideCrashRating, roll: x.RolloverRating };
  }

  function loadSafety(rec) {
    lookupNHTSA(rec).then((n) => {
      const box = $("#ncapBox"); if (!box) return;
      const num = (v) => { const k = parseInt(v, 10); return Number.isFinite(k) ? k : null; };
      if (!n || num(n.overall) == null) { box.innerHTML = ""; return; }
      const row = (label, v) => num(v) == null ? "" : `<div class="safe-row"><span>${label}</span>${starsHTML(num(v), 5, "sm")}</div>`;
      box.innerHTML = `
        <p class="subhead">מבחני ריסוק בארה״ב (NHTSA)</p>
        <div class="safe-big"><b class="num" dir="ltr">${num(n.overall)}<small style="font-size:16px;color:var(--muted)">/5</small></b>${starsHTML(num(n.overall))}</div>
        ${row("התנגשות חזיתית", n.front)}${row("התנגשות צד", n.side)}${row("עמידות בהתהפכות", n.roll)}
        <p class="foot">מבחני NHTSA, רשות הבטיחות בדרכים בארה״ב, לגרסה ${esc(n.desc || "")}. הגרסה הישראלית עשויה להיות שונה.</p>`;
    }).catch(() => {
      const box = $("#ncapBox");
      if (box) box.innerHTML = `<p class="foot">לא הצלחתי לטעון תוצאות מבחני ריסוק כרגע.</p>`;
    });
  }

  // ---------- reviews ----------
  let currentModel = null;
  let isAdmin = false;
  const displayName = () => {
    const u = session?.user; if (!u) return "";
    const m = u.user_metadata || {};
    return (m.full_name || m.name || (u.email || "").split("@")[0] || "משתמש").slice(0, 60);
  };

  async function loadReviews() {
    const box = $("#revBox"); if (!box || !currentModel) return;
    if (!sb) { box.innerHTML = `<p class="foot">חוות הדעת יופעלו בקרוב.</p>`; return; }
    const key = currentModel.key;
    const { data, error } = await sb.from("reviews").select("id,user_id,rating,body,author_name,year,created_at")
      .eq("model_key", key).order("created_at", { ascending: false }).limit(200);
    if (!$("#revBox") || currentModel.key !== key) return;
    if (error) { box.innerHTML = `<p class="foot">חוות הדעת עוד לא הופעלו באתר.</p>`; console.warn(error); return; }
    renderReviews(data || []);
  }

  function renderReviews(list) {
    const box = $("#revBox"); if (!box) return;
    const avg = list.length ? list.reduce((a, r) => a + r.rating, 0) / list.length : 0;
    const mine = session ? list.find((r) => r.user_id === session.user.id) : null;
    let pick = mine ? mine.rating : 0;
    const showN = 10;

    const summary = list.length
      ? `<div class="rev-sum"><b class="num">${avg.toFixed(1)}</b><div style="display:grid;gap:4px">${starsHTML(avg)}<span class="foot">${list.length} חוות דעת של משתמשים</span></div></div>`
      : `<p>עוד אין חוות דעת על הדגם הזה. אפשר להיות הראשונים.</p>`;

    const form = session
      ? `<form class="rev-form" id="revForm">
          <span class="subhead" style="margin:0">${mine ? "עריכת חוות הדעת שלך" : "כתבו חוות דעת"}</span>
          <div class="pick" id="pick" role="radiogroup" aria-label="דירוג">${[1,2,3,4,5].map((i) => `<button type="button" data-v="${i}" aria-label="${i} כוכבים">★</button>`).join("")}</div>
          <textarea id="revBody" maxlength="1000" placeholder="איך הרכב? נוחות, אמינות, צריכת דלק, תקלות…">${esc(mine?.body || "")}</textarea>
          <span class="msg" id="revMsg" role="status"></span>
          <button class="primary" type="submit" id="revGo">${mine ? "עדכן" : "פרסם"}</button>
          <span class="foot">יפורסם בשם: ${esc(displayName())}</span>
        </form>`
      : `<button class="btn-ghost" type="button" id="revLogin" style="margin-top:6px">התחברו כדי לכתוב חוות דעת</button>`;

    const items = list.map((r, i) => `
      <article class="rev" ${i >= showN ? "hidden" : ""}>
        <div class="rev-top"><b>${esc(r.author_name || "משתמש")}</b>${starsHTML(r.rating, 5, "sm")}</div>
        <small class="foot">${new Date(r.created_at).toLocaleDateString("he-IL")}${r.year ? ` · רכב משנת ${esc(r.year)}` : ""}</small>
        ${r.body ? `<p>${esc(r.body)}</p>` : ""}
        ${(session && (r.user_id === session.user.id || isAdmin)) ? `<button class="del" type="button" data-id="${r.id}">מחק</button>` : ""}
      </article>`).join("");

    box.innerHTML = `${summary}${form}
      ${list.length ? `<div class="rev-list" style="margin-top:6px">${items}</div>` : ""}
      ${list.length > showN ? `<button class="btn-ghost" type="button" id="revMore">הצג את כל ${list.length} חוות הדעת</button>` : ""}`;

    const more = $("#revMore");
    if (more) more.onclick = () => { box.querySelectorAll(".rev[hidden]").forEach((e) => e.hidden = false); more.remove(); };
    const login = $("#revLogin");
    if (login) login.onclick = () => openLogin("כדי לכתוב חוות דעת צריך להתחבר.");

    box.querySelectorAll(".del").forEach((b) => b.onclick = async () => {
      if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "בטוח? לחצו שוב למחיקה"; return; }
      b.disabled = true;
      const { error } = await sb.from("reviews").delete().eq("id", b.dataset.id);
      if (error) { b.textContent = "המחיקה נכשלה"; return; }
      loadReviews();
    });

    const form$ = $("#revForm");
    if (!form$) return;
    const paintPick = () => $("#pick").querySelectorAll("button").forEach((b) => b.classList.toggle("on", Number(b.dataset.v) <= pick));
    paintPick();
    $("#pick").querySelectorAll("button").forEach((b) => b.onclick = () => { pick = Number(b.dataset.v); paintPick(); });
    form$.onsubmit = async (e) => {
      e.preventDefault();
      const msg = $("#revMsg"), go = $("#revGo");
      if (!pick) { msg.className = "msg no"; msg.textContent = "בחרו דירוג של 1 עד 5 כוכבים."; return; }
      go.disabled = true; msg.className = "msg"; msg.textContent = "שומר…";
      const row = {
        user_id: session.user.id, model_key: currentModel.key, title: currentModel.title, year: currentModel.year,
        rating: pick, body: $("#revBody").value.trim().slice(0, 1000), author_name: displayName(),
      };
      const { error } = await sb.from("reviews").upsert(row, { onConflict: "user_id,model_key" });
      go.disabled = false;
      if (error) { msg.className = "msg no"; msg.textContent = "לא הצלחתי לשמור. נסו שוב."; console.warn(error); return; }
      loadReviews();
    };
  }

  // ---------- admin ----------
  async function refreshAdmin() {
    isAdmin = false;
    if (!sb || !session) return;
    const { data } = await sb.rpc("is_admin");
    isAdmin = !!data;
  }

  async function openAdmin() {
    openSheet(`<h2>עמוד ניהול</h2><div id="adminBox"><div class="status"><div class="spinner"></div><span>טוען נתונים…</span></div></div>
      <button class="textbtn" type="button" data-close>סגור</button>`, true);
    const { data, error } = await sb.rpc("admin_stats");
    const box = $("#adminBox"); if (!box) return;
    if (error || !data) { box.innerHTML = `<p class="no">אין הרשאת ניהול, או שהגדרות הניהול עוד לא הותקנו ב-Supabase.</p>`; return; }
    const d = (v) => v ? new Date(v).toLocaleDateString("he-IL") : "—";
    const stat = (label, v) => `<div class="stat"><span>${label}</span><b>${nf(v)}</b></div>`;
    box.innerHTML = `
      <div class="stat-grid">
        ${stat("משתמשים רשומים", data.users)}${stat("חדשים השבוע", data.users_7d)}${stat("רכבים שנבדקו", data.searches)}
        ${stat("רכבים שמורים", data.saved)}${stat("חוות דעת", data.reviews)}
      </div>
      <h3 class="subhead">הדגמים הכי נבדקים</h3>
      <div class="scroll-x"><table class="admin-table"><thead><tr><th>דגם</th><th>בדיקות</th></tr></thead><tbody>
        ${(data.top_models || []).map((m) => `<tr><td>${esc(m.title || "—")}</td><td class="num">${nf(m.n)}</td></tr>`).join("") || `<tr><td colspan="2">אין עדיין נתונים</td></tr>`}
      </tbody></table></div>
      <h3 class="subhead">נרשמו לאחרונה</h3>
      <div class="scroll-x"><table class="admin-table"><thead><tr><th>אימייל</th><th>נרשם</th><th>התחבר לאחרונה</th></tr></thead><tbody>
        ${(data.recent_users || []).map((u) => `<tr><td dir="ltr" style="text-align:right">${esc(u.email || "—")}</td><td>${d(u.created_at)}</td><td>${d(u.last_sign_in_at)}</td></tr>`).join("") || `<tr><td colspan="3">אין עדיין משתמשים</td></tr>`}
      </tbody></table></div>
      <h3 class="subhead">חוות דעת אחרונות</h3>
      <div class="rev-list">
        ${(data.recent_reviews || []).map((r) => `<article class="rev">
            <div class="rev-top"><b>${esc(r.title || "")} · ${esc(r.author_name || "")}</b>${starsHTML(r.rating, 5, "sm")}</div>
            <small class="foot">${d(r.created_at)}</small>${r.body ? `<p>${esc(r.body)}</p>` : ""}
            <button class="del" type="button" data-id="${r.id}">מחק</button></article>`).join("") || `<p class="foot">אין עדיין חוות דעת.</p>`}
      </div>`;
    box.querySelectorAll(".del").forEach((b) => b.onclick = async () => {
      if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "בטוח? לחצו שוב למחיקה"; return; }
      b.disabled = true;
      const { error } = await sb.from("reviews").delete().eq("id", b.dataset.id);
      if (error) { b.textContent = "המחיקה נכשלה"; return; }
      b.closest(".rev").remove();
    });
  }

  // ---------- sheets ----------
  function openSheet(html, wide = false) {
    const host = $("#sheetHost");
    host.innerHTML = `<div class="sheet-back" id="sheetBack"><div class="sheet${wide ? " wide" : ""}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
    $("#sheetBack").onclick = (e) => { if (e.target.id === "sheetBack") closeSheet(); };
    host.querySelectorAll("[data-close]").forEach((b) => b.onclick = closeSheet);
  }
  function closeSheet() { $("#sheetHost").innerHTML = ""; }

  function openPaywall() {
    openSheet(`
      <h2>מספר שלדה מלא</h2>
      <p>מספר השלדה (VIN) המלא מאפשר לבדוק היסטוריית תאונות, יבוא וריקולים. החשיפה עולה ${esc(VIN_PRICE)}.</p>
      ${VIN_PAYMENT_URL
        ? `<a class="primary" style="display:grid;place-items:center;text-decoration:none" href="${esc(VIN_PAYMENT_URL)}" target="_blank" rel="noopener">לתשלום ${esc(VIN_PRICE)}</a>`
        : `<button class="primary" type="button" disabled>התשלום יופעל בקרוב</button>`}
      <button class="textbtn" type="button" data-close>לא עכשיו</button>`);
  }

  // ---------- accounts (Supabase) ----------
  const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let session = null;
  let cloud = []; // [{plate,title,year,saved,searched_at}]

  // local fallback (this device only)
  const LKEY = "carcheck.items";
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LKEY) || "[]"); } catch (_) { return []; } };
  const saveLocal = (list) => { try { localStorage.setItem(LKEY, JSON.stringify(list.slice(0, 40))); } catch (_) {} };
  const items = () => session ? cloud : loadLocal();
  const isSaved = (d) => items().some((i) => i.plate === d && i.saved);

  async function upsertItem(item) {
    if (session) {
      const row = { user_id: session.user.id, plate: item.plate, title: item.title, year: item.year, saved: item.saved, searched_at: new Date().toISOString() };
      const { error } = await sb.from("car_history").upsert(row, { onConflict: "user_id,plate" });
      if (error) { console.warn(error); return; }
      cloud = [row, ...cloud.filter((c) => c.plate !== item.plate)];
    } else {
      saveLocal([{ ...item, searched_at: new Date().toISOString() }, ...loadLocal().filter((c) => c.plate !== item.plate)]);
    }
    renderHistory();
  }
  function addToHistory(plate, title, year) {
    const prev = items().find((i) => i.plate === plate);
    upsertItem({ plate, title, year, saved: prev ? !!prev.saved : false });
  }
  async function toggleSaved(plate, title, year) {
    if (!session && sb) {
      openLogin("כדי לשמור רכבים בחשבון ולראות אותם מכל מכשיר, התחברו או הירשמו.");
      return;
    }
    await upsertItem({ plate, title, year, saved: !isSaved(plate) });
  }
  async function loadCloud() {
    if (!session) { cloud = []; return; }
    const { data, error } = await sb.from("car_history").select("plate,title,year,saved,searched_at").order("searched_at", { ascending: false }).limit(50);
    cloud = error ? [] : data;
  }

  let historyMode = "recent";
  function renderHistory() {
    const all = items();
    const saved = all.filter((i) => i.saved);
    const list = historyMode === "saved" ? saved : all;
    $("#historyBox").hidden = all.length === 0;
    $("#historyTitle").textContent = historyMode === "saved" ? "רכבים שמורים" : (session ? "ההיסטוריה שלי" : "חיפושים אחרונים");
    const act = $("#historyAction");
    act.hidden = !saved.length && historyMode !== "saved";
    act.textContent = historyMode === "saved" ? "הצג הכל" : `שמורים (${saved.length})`;
    $("#history").innerHTML = list.slice(0, 20).map((h) =>
      `<button class="hchip" type="button" data-d="${esc(h.plate)}"><b>${h.saved ? "♥ " : ""}${esc(h.title || "רכב")}${h.year ? " " + esc(h.year) : ""}</b><span>${fmtPlate(h.plate)}</span></button>`).join("");
    $("#history").querySelectorAll("button").forEach((b) => b.onclick = () => {
      currentPhoto = null; $("#plateInput").value = fmtPlate(b.dataset.d); searchCandidates([b.dataset.d]);
    });
  }
  $("#historyAction").onclick = () => { historyMode = historyMode === "saved" ? "recent" : "saved"; renderHistory(); };

  function paintAccount() {
    if (session) {
      const nm = displayName() || session.user.email || "?";
      $("#avatar").textContent = nm[0].toUpperCase();
      $("#accountLabel").textContent = "החשבון שלי";
    } else {
      $("#avatar").innerHTML = '<svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
      $("#accountLabel").textContent = "התחברות";
    }
  }

  function openLogin(reason) {
    if (!sb) {
      openSheet(`
        <h2>חשבונות משתמשים</h2>
        <p>ההרשמה עוד לא הופעלה באתר הזה. בינתיים ההיסטוריה והרכבים השמורים נשמרים במכשיר הזה בלבד.</p>
        <button class="primary" type="button" data-close>הבנתי</button>`);
      return;
    }
    let mode = "in";
    openSheet(`
      <h2 id="loginTitle">התחברות</h2>
      ${reason ? `<p>${esc(reason)}</p>` : `<p>שמרו רכבים, כתבו חוות דעת וראו את ההיסטוריה שלכם מכל מכשיר.</p>`}
      <button class="gbtn" type="button" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        המשך עם Google
      </button>
      <span class="msg" id="googleMsg" role="status"></span>
      <div class="or">או עם אימייל</div>
      <div class="seg" role="tablist">
        <button type="button" class="on" id="tabIn">התחברות</button>
        <button type="button" id="tabUp">הרשמה</button>
      </div>
      <form id="loginForm" style="display:grid;gap:12px">
        <div class="field"><label for="email">אימייל</label><input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="pass">סיסמה</label><input id="pass" type="password" autocomplete="current-password" minlength="6" required></div>
        <span class="msg" id="loginMsg" role="status"></span>
        <button class="primary" type="submit" id="loginGo">התחבר</button>
      </form>
      <button class="textbtn" type="button" data-close>ביטול</button>`);
    const setMode = (m) => {
      mode = m;
      $("#tabIn").classList.toggle("on", m === "in");
      $("#tabUp").classList.toggle("on", m === "up");
      $("#loginTitle").textContent = m === "in" ? "התחברות" : "הרשמה";
      $("#loginGo").textContent = m === "in" ? "התחבר" : "צור חשבון";
      $("#pass").autocomplete = m === "in" ? "current-password" : "new-password";
      $("#loginMsg").textContent = "";
    };
    $("#googleBtn").onclick = async () => {
      const m = $("#googleMsg");
      m.className = "msg"; m.textContent = "מעביר ל-Google…";
      const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
      if (error) {
        m.className = "msg no";
        m.textContent = /not enabled|Unsupported provider/i.test(error.message) ? "ההתחברות עם Google עוד לא הופעלה באתר." : "משהו השתבש: " + error.message;
      }
    };
    $("#tabIn").onclick = () => setMode("in");
    $("#tabUp").onclick = () => setMode("up");
    $("#loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = $("#email").value.trim(), password = $("#pass").value;
      const msg = $("#loginMsg"), go = $("#loginGo");
      go.disabled = true; msg.className = "msg"; msg.textContent = "רגע…";
      try {
        if (mode === "in") {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          closeSheet();
        } else {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) closeSheet();
          else { msg.className = "msg ok"; msg.textContent = "שלחנו מייל אימות. אחרי האישור אפשר להתחבר."; setMode("in"); msg.className = "msg ok"; msg.textContent = "שלחנו מייל אימות. אחרי האישור אפשר להתחבר."; }
        }
      } catch (err) {
        msg.className = "msg no";
        const t = String(err.message || err);
        msg.textContent = /Invalid login/i.test(t) ? "האימייל או הסיסמה לא נכונים."
          : /already registered/i.test(t) ? "האימייל הזה כבר רשום. נסו להתחבר."
          : /Email not confirmed/i.test(t) ? "צריך לאשר את המייל שנשלח אליכם."
          : /Password/i.test(t) ? "הסיסמה צריכה להכיל לפחות 6 תווים."
          : "משהו השתבש: " + t;
      } finally { go.disabled = false; }
    };
  }

  function openAccount() {
    openSheet(`
      <h2>${esc(displayName())}</h2>
      <p dir="ltr" style="text-align:right">${esc(session.user.email || "")}</p>
      <p>שמורים: ${cloud.filter((c) => c.saved).length} · בהיסטוריה: ${cloud.length}</p>
      ${isAdmin ? `<button class="primary" type="button" id="adminBtn">עמוד ניהול</button>` : ""}
      <button class="primary" type="button" id="logout" style="background:var(--fg);color:var(--bg)">התנתקות</button>
      <button class="textbtn" type="button" data-close>סגור</button>`);
    $("#logout").onclick = async () => { await sb.auth.signOut(); closeSheet(); };
    const ab = $("#adminBtn"); if (ab) ab.onclick = openAdmin;
  }

  $("#accountBtn").onclick = () => session ? openAccount() : openLogin();

  async function syncLocalToCloud() {
    const local = loadLocal();
    if (!local.length) return;
    const rows = local.map((i) => ({ user_id: session.user.id, plate: i.plate, title: i.title, year: i.year, saved: !!i.saved, searched_at: i.searched_at || new Date().toISOString() }));
    const { error } = await sb.from("car_history").upsert(rows, { onConflict: "user_id,plate" });
    if (!error) saveLocal([]);
  }

  if (sb) {
    sb.auth.onAuthStateChange(async (_evt, s) => {
      session = s;
      if (session) { await syncLocalToCloud(); await loadCloud(); }
      await refreshAdmin();
      paintAccount(); renderHistory();
      if ($("#revBox")) loadReviews();
    });
    sb.auth.getSession().then(({ data }) => { session = data.session; paintAccount(); });
  }

  // ---------- wiring ----------
  $("#cam").onchange = (e) => { handleFile(e.target.files[0]); e.target.value = ""; };
  $("#gal").onchange = (e) => { handleFile(e.target.files[0]); e.target.value = ""; };
  $("#searchForm").onsubmit = (e) => {
    e.preventDefault();
    const d = $("#plateInput").value.replace(/\D/g, "");
    const hint = $("#hint");
    if (d.length < 5 || d.length > 8) { hint.textContent = "מספר רישוי צריך להכיל 5 עד 8 ספרות."; hint.classList.add("err"); return; }
    hint.textContent = "אפשר גם להקליד מספר. הנתונים מגיעים ממאגרי משרד התחבורה."; hint.classList.remove("err");
    $("#plateInput").value = fmtPlate(d);
    $("#plateInput").blur();
    currentPhoto = null;
    searchCandidates([d]);
  };
  paintAccount();
  renderHistory();
})();
</script>
</body>
</html>
